# DP2DP3 Single Model Policy Configuration for RoBoTwin
# 用于单模型训练模型的推理配置（测试融合是否破坏语义）

# ✅ 指定deploy模块 (重要! 需要完整路径)
deploy_module: DP2DP3.deploy_single_model_policy

# 任务配置（由 eval_single_model.sh 传入）
policy_name: null
task_name: null
task_config: null
ckpt_setting: null
seed: null
instruction_type: unseen

# 配置名称
config_name: dp2dp3_single_model
checkpoint_num: best
expert_data_num: null
use_rgb: true
model_name: dinov3  # 默认使用dinov3, 可选: croco, vggt, dinov3, da3

# 模型架构参数
model:
  # 单模型配置
  models:
    croco:
      dim: 1024
    vggt:
      dim: 2048
    dinov3:
      dim: 768
    da3:
      dim: 2048
  
  # Diffusion Head 配置
  head:
    horizon: 8                  # 预测未来 8 步
    n_obs_steps: 2              # 观测 2 帧
    num_inference_steps: 100    # 扩散推理步数
    action_dim: 14              # 动作维度（双臂 + gripper）
