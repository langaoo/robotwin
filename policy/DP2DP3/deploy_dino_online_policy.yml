# Checkpoint 目录: checkpoints_dino_online/<task>-<ckpt_setting>-<N>-<seed>/

# ✅ 指定 deploy 模块
deploy_module: DP2DP3.deploy_dino_online_policy

# 任务配置（由 eval 脚本传入）
